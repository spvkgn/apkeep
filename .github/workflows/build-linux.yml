name: build musl

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: 'build :: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            image: aarch64-musl
          - target: arm-unknown-linux-musleabi
            image: arm-musleabi
          - target: arm-unknown-linux-musleabihf
            image: arm-musleabihf
          - target: armv7-unknown-linux-musleabi
            image: armv7-musleabi
          - target: armv7-unknown-linux-musleabihf
            image: armv7-musleabihf
          - target: i686-unknown-linux-musl
            image: i686-musl
          - target: x86_64-unknown-linux-musl
            image: x86_64-musl
    container:
      image: ghcr.io/rust-cross/rust-musl-cross:${{ matrix.image }}
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          cat >> Cargo.toml <<'EOF'

          [dependencies.openssl-sys]
          version = "0.9"
          features = ["vendored"]
          EOF

          if ! command -v perl >/dev/null 2>&1; then
            apk add --no-cache perl
          fi

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip and package
        run: |
          mkdir -p output
          cp target/${{ matrix.target }}/release/apkeep output/apkeep
          musl-strip output/apkeep 2>/dev/null || strip output/apkeep || true
          tar -C output -czf "apkeep-${VERSION}-${{ matrix.target }}.tar.gz" apkeep

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apkeep-${{ matrix.image }}
          path: apkeep-*.tar.gz

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          prerelease: false
          draft: false
          tag_name: ${{ env.VERSION }}-musl
          name: ${{ env.VERSION }} musl
          target_commitish: ${{ github.sha }}
          body: |
            ### apkeep v${{ env.VERSION }} musl build for Linux
          files: apkeep-*.tar.gz
